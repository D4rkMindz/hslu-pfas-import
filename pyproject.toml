[project]
name = "26h-deng"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "kestra>=2.0.0",
    "pandas>=3.0.6",
    "psycopg>=3.3.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "requests>=2.34.2",
    "s3fs>=2026.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
